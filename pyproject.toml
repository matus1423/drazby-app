[project]
name = "drazby"
version = "0.1.0"
description = "Zber dražieb nehnuteľností na Slovensku z verejných registrov"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "selectolax>=0.3.21",
  "pdfplumber>=0.11",
  "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
postgres = ["psycopg[binary]>=3.2"]

[project.scripts]
drazby = "drazby.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["scrapers"]

[tool.pytest.ini_options]
testpaths = ["scrapers/tests"]
